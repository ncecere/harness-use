server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|woff2|jpg|jpeg|png|webp|svg)$ {
        expires 1h;
        try_files $uri =404;
    }

    # starter files download as plain bytes and are never rendered.
    # (no add_header here, so the server-level security headers still apply)
    location ^~ /files/ {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
