name: Check library entries

# Monthly: re-check every skill and MCP server in js/library.js against GitHub.
# A failing run means an entry's repo is gone, archived, stale, or its SKILL.md moved.
# Results are in the run's summary. To update the "Checked" date after a clean run:
#   node tools/check-library.mjs --write-date

on:
  schedule:
    - cron: "17 13 1 * *"   # 13:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check library entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check-library.mjs
